# Publishes a v* tag to npm with trusted publishing (OIDC) and provenance. A maintainer pushes a vX.Y.Z tag on master,
# and a reviewer approves the job in the release environment. The workflow refuses a private package or a tag that
# differs from the package version, checks the tagged tree, packs it once, runs the pack test on that exact tarball,
# and publishes that tarball. If this version is already on npm, it skips the publish and says so, so a re-run is safe.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # First, before anything is installed or built. `npm publish --dry-run` does not refuse a private package,
      # so the workflow reads package.json itself.
      - name: Refuse a private package or a tag that differs from the version
        run: |
          node -e '
            const pkg = require("./package.json")
            if (pkg.private !== undefined && pkg.private !== false) {
              console.error("::error::package.json has \"private\": " + JSON.stringify(pkg.private) + ", so nothing was published. Tag a release commit that removes it.")
              process.exit(1)
            }
            if (process.env.GITHUB_REF_NAME !== "v" + pkg.version) {
              console.error("::error::The tag " + process.env.GITHUB_REF_NAME + " does not match the package version " + pkg.version + ".")
              process.exit(1)
            }
          '
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no caches in release builds
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # the Bun inside stock OpenCode 2.2.3, 2.2.4 and 2.2.5
          no-cache: true
      - name: Require npm 11.5.1 or later for trusted publishing
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error("::error::npm " + process.argv[1] + " cannot use trusted publishing. It needs npm 11.5.1 or later.")
              process.exit(1)
            }
          ' "$(npm --version)"
      - run: npm ci --ignore-scripts
      - run: npm run check
      # npm run check built dist/. Pack that tree, then install and load exactly this tarball before publishing it.
      - name: Pack the checked tree
        id: pack
        run: |
          mkdir "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/package" > "$RUNNER_TEMP/pack.json"
          tarball="$RUNNER_TEMP/package/$(node -p 'require(process.argv[1])[0].filename' "$RUNNER_TEMP/pack.json")"
          sha256sum "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Test the tarball that will be published
        env:
          PACK_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm run test:pack
      # npm view prints the version when it is published, prints nothing for an unpublished version of a known
      # package, and fails with E404 for a package that does not exist yet. Any other failure stops the release.
      - name: Skip the publish if this version is already on npm
        id: published
        run: |
          spec="$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')"
          if found="$(npm view "$spec" version 2> "$RUNNER_TEMP/view.err")"; then
            if [ "$found" = "${spec##*@}" ]; then
              echo "::notice::$spec is already on npm, so this run publishes nothing."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif ! grep -q E404 "$RUNNER_TEMP/view.err"; then
            cat "$RUNNER_TEMP/view.err" >&2
            echo "::error::npm view $spec failed, so the workflow cannot tell whether it is already published."
            exit 1
          fi
          echo "$spec is not on npm yet."
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Publish the tarball with provenance
        if: steps.published.outputs.skip == 'false'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm publish "$TARBALL" --provenance --access public --tag "$tag"
